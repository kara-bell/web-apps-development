<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="QualityHub — учебное веб-приложение для отправки заявки на демонстрацию системы управления качеством ПО.">
  <meta name="theme-color" content="#2563eb">
  <title>{% block title %}QualityHub — заявка на демо{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3' fill='%2306b6d4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="{{ url_for('index') }}">QualityHub</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <a href="{{ url_for('index') }}">Заявка на демо</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container{% block main_class %}{% endblock %}" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>QualityHub — учебный проект по курсу «Разработка веб-приложения».</p>
    </div>
  </footer>
</body>
</html>
