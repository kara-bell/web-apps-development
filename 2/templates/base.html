<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QualityHub — заявка на демо{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="{{ url_for('index') }}">QualityHub</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <a href="{{ url_for('index') }}">Заявка на демо</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>QualityHub — учебный проект по курсу «Разработка веб-приложения».</p>
    </div>
  </footer>
</body>
</html>
