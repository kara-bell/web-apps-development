<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QualityHub · Монитор тестовых прогонов</title>
  <meta name="description"
    content="Учебный монитор тестовых прогонов: загрузка JSON и XML по AJAX, обновления по WebSocket и Server Sent Events.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>

<body>
  <main class="page">
    <section class="panel" aria-labelledby="page-title">
      <div class="panel__head">
        <h1 class="panel__title" id="page-title">Монитор тестовых прогонов</h1>
        <button class="button" type="button" id="load-json">Загрузить данные из JSON</button>
      </div>

      <p class="message" id="json-message" role="status" aria-live="polite"></p>

      <div class="ws-bar">
        <span class="ws-status" id="ws-status" data-state="wait">
          <span class="ws-status__dot" aria-hidden="true"></span>
          <span id="ws-status-text" aria-live="polite">WS: подключение…</span>
        </span>

        <label class="switch">
          <input class="switch__input" id="ws-updates" type="checkbox" role="switch" checked>
          <span class="switch__track" aria-hidden="true"></span>
          <span class="switch__label">Онлайн-обновления</span>
        </label>

        <span class="ws-updated" id="ws-updated">Обновлено: —</span>

        <button class="button button--ghost button--small" type="button" id="ws-refresh"
          aria-label="Запросить обновление по WebSocket" title="Запросить обновление по WebSocket" disabled>
          Обновить
        </button>
      </div>

      <div class="table-wrap" id="runs-container" hidden>
        <table class="table">
          <caption class="visually-hidden">Тестовые прогоны из JSON-файла</caption>
          <thead>
            <tr>
              <th scope="col">Набор</th>
              <th scope="col">Статус</th>
              <th scope="col">Длительность</th>
              <th scope="col">Автор</th>
              <th scope="col">Запуск</th>
            </tr>
          </thead>
          <tbody id="runs-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <noscript>
    <p class="noscript">Для работы монитора нужен JavaScript.</p>
  </noscript>
</body>

</html>
